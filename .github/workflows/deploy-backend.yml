name: Deploy Backend to Oracle Cloud

on:
  push:
    branches: [ "main" ] # Se activa cuando haces push a la rama main
    paths:
      - 'src/**'       # Solo si cambias código fuente
      - 'pom.xml'      # O dependencias
      - '.github/workflows/deploy-backend.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Bajar el código del repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Instalar Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Compilar el proyecto (Crear el JAR)
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 4. Copiar el JAR al servidor (usando scp)
      - name: Copy JAR to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "target/facushop-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/facushop/"
          # 'strip_components: 1' sirve para que no cree la carpeta 'target' en el destino,
          # pero como ya la tenés, mejor lo dejamos estándar.
          # Esto copiará el archivo a /home/ubuntu/facushop/target/facushop...jar

      # 5. Conectarse por SSH y reiniciar el servicio
      - name: Restart Service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            echo "Deteniendo servicio actual..."
            sudo systemctl stop facushop
            
            echo "Reiniciando servicio..."
            sudo systemctl start facushop
            
            echo "Verificando estado..."
            sudo systemctl status facushop --no-pager